# Release builds, triggered by pushing a `v*` tag to GitHub.
#
#   git tag -a v0.1.0 -m "Scoria 0.1.0" && git push origin v0.1.0
#
# Each runner builds the `scoria` binary for its own host target and uploads one
# archive; the final job collects them, writes SHA256SUMS, and publishes the
# release with notes generated from the commits since the previous tag. A tag
# with a hyphen in it (v0.2.0-rc1) is published as a prerelease.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Build provenance attestations for the archives (Sigstore, through GitHub).
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fail before spending three build slots if the tag and the workspace version
  # disagree: the archives are named from the tag and the binary reports the
  # manifest version, so they have to match.
  version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version = "\(.*\)"$/\1/p')
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version $manifest"
            exit 1
          fi

  build:
    name: ${{ matrix.target }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Linux build dependencies for gpui
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libasound2-dev libfontconfig-dev libfreetype-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libssl-dev libzstd-dev \
            libvulkan-dev libgl-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      # --locked: Cargo.lock pins libc and the gpui revision on purpose (see Cargo.toml).
      - name: Build
        run: cargo build --release --locked -p scoria

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="scoria-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/scoria.exe "dist/$name/"
          else
            cp target/release/scoria "dist/$name/"
            strip "dist/$name/scoria" 2>/dev/null || true
          fi
          # macOS keeps an application's icon, name and version in a bundle
          # rather than in the executable, so the archive ships Scoria.app.
          # `scoria` stays beside it as a symlink into the bundle, so the
          # documented `./scoria ~/notes` keeps working.
          if [ "${{ runner.os }}" = "macOS" ]; then
            tools/macos-app/bundle.sh "dist/$name/scoria" "dist/$name"
            rm "dist/$name/scoria"
            ln -s Scoria.app/Contents/MacOS/scoria "dist/$name/scoria"
          fi
          # A Linux desktop reads the icon out of the icon theme, not out of
          # the binary, so the archive carries the entry, the hicolor theme
          # and the installer that puts both under ~/.local/share.
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp tools/linux-desktop/install.sh "dist/$name/"
            cp crates/scoria/resources/linux/scoria.desktop "dist/$name/"
            cp -r crates/scoria/resources/linux/icons "dist/$name/"
          fi
          cp README.md LICENSE "dist/$name/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$name.zip" "$name" >/dev/null
          else
            tar czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: scoria-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # A versionless copy of each archive. GitHub resolves
      # /releases/latest/download/<name> by exact file name, so an address that
      # survives the next tag needs a name with no version in it; these three are
      # what scoria.cc's download buttons point at. The versioned names stay
      # beside them, because a file sitting in a downloads folder should still say
      # which release it came from.
      - name: Stable download names
        run: |
          set -euo pipefail
          cd dist
          tag="$GITHUB_REF_NAME"
          cp "scoria-$tag-x86_64-unknown-linux-gnu.tar.gz" scoria-linux-x86_64.tar.gz
          cp "scoria-$tag-x86_64-pc-windows-msvc.zip"      scoria-windows-x86_64.zip
          cp "scoria-$tag-aarch64-apple-darwin.tar.gz"     scoria-macos-aarch64.tar.gz
          ls -l

      # Name the inputs explicitly so SHA256SUMS can never list itself. Both
      # names of each archive are listed, so `sha256sum -c --ignore-missing`
      # checks out whichever of the two the reader downloaded.
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%P\n' \
            | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      # Provenance for every archive, signed by GitHub's Sigstore instance and
      # tied to this workflow run and commit. Needs no secret. Verify with
      #   gh attestation verify <archive> --repo ragtux/scoria
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          # The versioned archives alone: the stable-named copies above are
          # byte-identical, and an attestation is looked up by digest, so
          # `gh attestation verify` accepts either name against this one subject.
          subject-path: |
            dist/scoria-${{ github.ref_name }}-*.tar.gz
            dist/scoria-${{ github.ref_name }}-*.zip

      # A detached GPG signature over SHA256SUMS when the maintainer's key is
      # in the repository secrets (GPG_SIGNING_KEY: the armored private key,
      # GPG_PASSPHRASE: its passphrase, may be empty). Without the key the
      # release is published unsigned and its notes say so.
      - name: Sign checksums
        id: sign
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$GPG_SIGNING_KEY" ]; then
            echo "no GPG_SIGNING_KEY secret; publishing unsigned"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export GNUPGHOME=$(mktemp -d)
          printf '%s' "$GPG_SIGNING_KEY" | gpg --batch --import
          fpr=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10; exit}')
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --local-user "$fpr" --armor --detach-sign --output dist/SHA256SUMS.asc dist/SHA256SUMS
          gpg --batch --verify dist/SHA256SUMS.asc dist/SHA256SUMS
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$fpr" >> "$GITHUB_OUTPUT"

      - name: Release notes
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          prev=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)
          {
            if [ -n "$prev" ]; then
              echo "## Changes since $prev"
              echo
              git log --no-merges --reverse --pretty='- %s' "$prev..$tag"
            else
              echo "First tagged release."
            fi
            echo
            echo "## Binaries"
            echo
            echo "Builds of the \`scoria\` binary, not code-signed for macOS or Windows."
            echo
            echo "Each archive is here twice: once named for this tag, and once under a"
            echo "name with no version in it, which is the address that always points at"
            echo "the newest release and the one <https://scoria.cc/download/> links:"
            echo
            echo "- <https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/scoria-linux-x86_64.tar.gz>"
            echo "- <https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/scoria-windows-x86_64.zip>"
            echo "- <https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/scoria-macos-aarch64.tar.gz>"
            echo
            echo "Verify with \`sha256sum -c SHA256SUMS\` and"
            echo "\`gh attestation verify <archive> --repo ${GITHUB_REPOSITORY}\`."
            if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
              echo "\`SHA256SUMS.asc\` is a detached GPG signature by key"
              echo "\`${{ steps.sign.outputs.fingerprint }}\`: \`gpg --verify SHA256SUMS.asc SHA256SUMS\`."
            else
              echo "This release's checksums are not GPG-signed."
            fi
            echo "Run it against a vault folder: \`scoria /path/to/vault\`."
          } > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          case "$tag" in
            *-*) pre=--prerelease ;;
            *)   pre= ;;
          esac
          gh release create "$tag" \
            --title "Scoria ${tag#v}" \
            --notes-file notes.md \
            $pre \
            dist/*
