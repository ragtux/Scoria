[package]
name = "scoria-text"
description = "The editor's text model: buffer, line index, selections, undo and the edit plans of the editing commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
regex.workspace = true
# The table commands find the table under the cursor with the one Markdown
# parser rather than by looking for pipes.
scoria-markdown.workspace = true
# Deletion and caret motion step by grapheme cluster, so one Backspace
# takes an accented letter or a joined emoji whole.
unicode-segmentation = "1"

[dev-dependencies]
scoria-cache.workspace = true
serde.workspace = true
# The canvas round trip compares two canvases as JSON to tell a key-order
# rewrite from a changed value; `preserve_order` keeps `Value`'s own keys in
# file order, and `IndexMap`'s `PartialEq` is order-independent, which is
# exactly the comparison that question needs.
serde_json.workspace = true
scoria-formats.workspace = true
scoria-suggest.workspace = true
scoria-templates.workspace = true
scoria-vault.workspace = true
tempfile.workspace = true
