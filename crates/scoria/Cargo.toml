[package]
name = "scoria"
description = "Scoria: a native Rust/GPUI knowledge base compatible with Obsidian vaults"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
# Windows resources: the icon as resource 1 and a VERSIONINFO block, which is
# where gpui's window class, the taskbar and Explorer all look. A no-op
# everywhere else, so it is not behind a target table.
build = "build.rs"

[[bin]]
name = "scoria"
path = "src/main.rs"

[dependencies]
scoria-vault.workspace = true
scoria-markdown.workspace = true
scoria-cache.workspace = true
scoria-commands.workspace = true
scoria-control.workspace = true
scoria-formats.workspace = true
scoria-search.workspace = true
scoria-suggest.workspace = true
scoria-templates.workspace = true
scoria-text.workspace = true
scoria-canvas.workspace = true
anyhow.workspace = true
async-channel.workspace = true
indexmap.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
notify.workspace = true
regex.workspace = true
serde_yaml.workspace = true
chrono.workspace = true
gpui.workspace = true
gpui_platform.workspace = true

[build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
tempfile.workspace = true
