[workspace]
resolver = "2"
members = [
    "crates/scoria",
    "crates/scoria-vault",
    "crates/scoria-markdown",
    "crates/scoria-cache",
    "crates/scoria-formats",
    "crates/scoria-mcp",
    "crates/scoria-commands",
    "crates/scoria-control",
    "crates/scoria-search",
    "crates/scoria-text",
    "crates/scoria-canvas",
    "crates/scoria-bases",
    "crates/scoria-suggest",
    "crates/scoria-templates",
    "crates/scoria-bench",
]

[workspace.package]
version = "0.3.2"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/ragtux/scoria"
license = "MIT"
publish = false

[workspace.dependencies]
scoria-vault = { path = "crates/scoria-vault" }
scoria-markdown = { path = "crates/scoria-markdown" }
scoria-cache = { path = "crates/scoria-cache" }
scoria-formats = { path = "crates/scoria-formats" }
scoria-commands = { path = "crates/scoria-commands" }
scoria-control = { path = "crates/scoria-control" }
scoria-search = { path = "crates/scoria-search" }
scoria-text = { path = "crates/scoria-text" }
scoria-canvas = { path = "crates/scoria-canvas" }
scoria-bases = { path = "crates/scoria-bases" }
scoria-suggest = { path = "crates/scoria-suggest" }
scoria-templates = { path = "crates/scoria-templates" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
async-channel = "2"
# AF_UNIX on Windows (10 1803 and later) behind std's own socket API: the
# control socket is a Unix domain socket there too. Already in the tree.
uds_windows = "1.2"
# Order-preserving map: Obsidian writes types.json in insertion order, so a
# sorted map would rewrite the file on every save.
indexmap = { version = "2", features = ["serde"] }
walkdir = "2"
tempfile = "3"
rayon = "1"
regex = "1"
notify = "8"
# Already in the tree through gpui; crates/scoria/build.rs compiles the icon
# and VERSIONINFO into scoria.exe with it, and does nothing off Windows.
embed-resource = "3"
# Already in the tree through gpui; the app needs it for the local civil
# date a daily note is named after and a template's `{{date}}` renders.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# gpui is pinned to a Zed release commit rather than the crates.io release: the crates.io 0.2.2
# bundles blade 0.7.1, whose unconditional ray-tracing request fails vkCreateDevice on NVIDIA.
# Zed v1.3.6 (2026) is known to run on the development machine and builds with rustc 1.95.
# Bump deliberately, one release at a time, and re-run `cargo run -p scoria` on a real GPU.
# Cargo.lock also pins libc to 0.2.189: gpui -> http_client -> async-tar -> xattr 0.2.3 reads
# `libc::ENOATTR`, which libc 0.2.190 removed on Linux. Drop the pin once async-tar moves to xattr 1.x.
gpui = { git = "https://github.com/zed-industries/zed", rev = "4ce18741ad2ea007cb20a1dd96d2a170d224cc01" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "4ce18741ad2ea007cb20a1dd96d2a170d224cc01", features = ["font-kit", "wayland", "x11"] }

[profile.dev]
opt-level = 0

# gpui and its graphics stack are slow at opt-level 0; keep dependencies optimized in debug builds.
[profile.dev.package."*"]
opt-level = 2
