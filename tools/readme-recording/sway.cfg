# Headless sway session for the README recordings: one 2x output the size of the
# window plus a margin, the wallpaper behind it, and Scoria floating at (68, 62).
output HEADLESS-1 mode 3072x2048 scale 2 bg WALLPAPER fill
default_border none
default_floating_border none
focus_follows_mouse no
for_window [app_id="scoria"] floating enable, border none, resize set 1400 900, move position 68 62
